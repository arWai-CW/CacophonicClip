name: Build VST3 / AU Plugins

on:
    # 推 tag（release）才產出插件；main 的 push 不跑，由 pull_request 驗證
    push:
        tags: ['*']
    pull_request:
        branches: [main]

jobs:
    build:
        name: Build on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            # 一個平台失敗不要取消另一個，不然看不到個別結果
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Set up Bun (for Web UI)
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Build Web UI
              working-directory: ui
              run: |
                  bun install --frozen-lockfile
                  bun run build

            # zip 必須在 configure/build 之前存在（juce_add_binary_data 的 DEPENDS）
            - name: Pack Source/UIResources.zip
              working-directory: Source/ui_dist
              run: cmake -E tar cf ../UIResources.zip --format=zip -- .

            # --- Windows 編譯流程 ---
            - name: Install WebView2 SDK (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory "$env:USERPROFILE\webview2"

            # 不 pin -G：windows-latest 已換成只有 Visual Studio 2026 的 image，
            # 不指定 generator 時 CMake 會自動選裝好的最新 Visual Studio
            # CLIP_VERSION 固定 0.0.0：PR build 只是驗證能編譯，沒有要發布的版號
            - name: Configure CMake (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: cmake -B build -A x64 -DCLIP_VERSION=0.0.0 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:USERPROFILE\webview2" -DCLIP_COPY_PLUGIN_AFTER_BUILD=OFF

            - name: Build (Windows)
              if: runner.os == 'Windows'
              run: cmake --build build --config Release

            # --- macOS 編譯流程 (產出 Universal Binary) ---
            # CLIP_VERSION 用 tag 名，Finder 顯示的版本才會跟 release 一致
            - name: Configure CMake (macOS)
              if: runner.os == 'macOS'
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCLIP_VERSION="${GITHUB_REF_NAME}" -DCLIP_COPY_PLUGIN_AFTER_BUILD=OFF

            - name: Build (macOS)
              if: runner.os == 'macOS'
              run: cmake --build build --config Release

            # 上傳產出的 Plugin 為 Artifacts
            # .exp/.lib 是 MSVC 連結 DLL 的副產物，不進 artifact 也不進 release
            - name: Upload Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: Plugin-${{ runner.os }}
                  path: |
                      build/CacophonicClip_artefacts/Release/VST3/
                      build/CacophonicClip_artefacts/Release/AU/
                      !**/*.exp
                      !**/*.lib

    # macOS 打包成 dmg。簽章目前走免費路線（見 docs/INSTALL-macOS.txt）：
    # 沒有 Developer ID 憑證，只保留 JUCE 在 Apple Silicon 上自動產生的 ad-hoc 簽章
    # （arm64 slice 一定要有簽章才載得進去，絕對不能 --remove-signature）。
    # 有 Apple Developer Program 之後要把 Developer ID 簽章與 notarytool 公證加在這裡，
    # 不要塞進上面的 build job，那個 job 也服務 PR，不能碰到憑證。
    package-mac:
        name: Package macOS disk image
        if: startsWith(github.ref, 'refs/tags/')
        needs: build
        runs-on: macos-latest
        steps:
            # 要拿安裝包原始碼與安裝說明，只拉這兩個路徑就夠
            - name: Checkout macOS installer sources
              uses: actions/checkout@v7
              with:
                  sparse-checkout: |
                      /docs/INSTALL-macOS.txt
                      /tools/macos-installer/
                  sparse-checkout-cone-mode: false

            - name: Download macOS artifact
              uses: actions/download-artifact@v8
              with:
                  name: Plugin-macOS
                  path: dist

            # dmg 裡只放安裝包。原始 .vst3 / .component 對使用者是陷阱：
            # 從瀏覽器下載的檔案帶 quarantine，而 Finder 右鍵選單對 plugin bundle
            # 不會出現「打開」，使用者只會看到「完成 / 移到垃圾桶」。
            - name: Build installer app
              run: tools/macos-installer/build-installer.sh dist "installer/Install Cacophonic Clip.app"

            # --strict 會連 resource seal 一起驗。VST3 bundle 裡有 Contents/Resources/moduleinfo.json，
            # 如果它在簽章之後才被塞進去，這一步就會抓到，壞掉直接讓 job 失敗
            - name: Verify signatures
              run: |
                  codesign --verify --strict "installer/Install Cacophonic Clip.app"
                  codesign --verify --strict "installer/Install Cacophonic Clip.app/Contents/Resources/Cacophonic Clip.vst3"
                  codesign --verify --strict "installer/Install Cacophonic Clip.app/Contents/Resources/Cacophonic Clip.component"

            - name: Stage dmg payload
              run: |
                  mkdir -p stage
                  ditto "installer/Install Cacophonic Clip.app" "stage/Install Cacophonic Clip.app"
                  cp docs/INSTALL-macOS.txt stage/INSTALL.txt

            # 用 diskutil 而不是 hdiutil create，hdiutil 那組參數在 macOS 27 已經 deprecated
            - name: Create dmg
              run: |
                  diskutil image create from --format UDZO --volumeName "Cacophonic Clip" \
                    stage "dist/CacophonicClip-${GITHUB_REF_NAME}-macOS.dmg"
                  hdiutil verify "dist/CacophonicClip-${GITHUB_REF_NAME}-macOS.dmg"
                  rm -rf stage installer

            - name: Upload dmg
              uses: actions/upload-artifact@v7
              with:
                  name: Release-macOS
                  path: dist/CacophonicClip-${{ github.ref_name }}-macOS.dmg

    # 只有推 tag 才把產物掛上 Release（PR / 一般跑法在這裡直接 skip）
    release:
        name: Attach artifacts to release
        if: startsWith(github.ref, 'refs/tags/')
        needs: [build, package-mac]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  path: dist

            # Release assets 只能是檔案，vst3 是目錄，Windows 的先壓成 zip。
            # macOS 已經在 package-mac 做好 dmg，這裡只收。
            # rm -f 是保險：萬一 upload 的排除沒生效，也別把 .exp/.lib 掛上 release
            - name: Pack release assets
              run: |
                  (cd dist/Plugin-Windows && rm -f VST3/*.exp VST3/*.lib && zip -ry "../CacophonicClip-${GITHUB_REF_NAME}-Windows.zip" VST3)

            # tag 已有 release（手動建過）就補上/覆蓋 asset；沒有就連同 release 一起建。
            # 沒有 checkout 步驟，gh 從環境變數拿 repo，不依賴 .git
            - name: Create release and upload assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
                      gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/Release-macOS/*.dmg --clobber
                  else
                      gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/*.zip dist/Release-macOS/*.dmg
                  fi
                  # 刪掉 tag 會讓 GitHub 把已發布的 release 降成 draft，URL 變成 untagged-<sha>，
                  # 而且重打 tag 不會把它接回去。所以重打 release 要用 git tag -f 加
                  # git push --force，不要刪 tag 再重推。這裡強制 publish 一次當保險。
                  gh release edit "$GITHUB_REF_NAME" --draft=false
