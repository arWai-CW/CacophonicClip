name: Build VST3 / AU / AAX Plugins

on:
    # 推 tag（release）才產出插件；main 的 push 不跑，由 pull_request 驗證
    push:
        tags: ['*']
    pull_request:
        branches: [main]

jobs:
    build:
        name: Build on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            # 一個平台失敗不要取消另一個，不然看不到個別結果
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Set up Bun (for Web UI)
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Build Web UI
              working-directory: ui
              run: |
                  bun install --frozen-lockfile
                  bun run build

            # zip 必須在 configure/build 之前存在（juce_add_binary_data 的 DEPENDS）
            - name: Pack Source/UIResources.zip
              working-directory: Source/ui_dist
              run: cmake -E tar cf ../UIResources.zip --format=zip -- .

            # --- Windows 編譯流程 ---
            - name: Install WebView2 SDK (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory "$env:USERPROFILE\webview2"

            # 不 pin -G：windows-latest 已換成只有 Visual Studio 2026 的 image，
            # 不指定 generator 時 CMake 會自動選裝好的最新 Visual Studio
            - name: Configure CMake (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: cmake -B build -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:USERPROFILE\webview2" -DCLIP_COPY_PLUGIN_AFTER_BUILD=OFF

            - name: Build (Windows)
              if: runner.os == 'Windows'
              run: cmake --build build --config Release

            # --- macOS 編譯流程 (產出 Universal Binary) ---
            - name: Configure CMake (macOS)
              if: runner.os == 'macOS'
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCLIP_COPY_PLUGIN_AFTER_BUILD=OFF

            - name: Build (macOS)
              if: runner.os == 'macOS'
              run: cmake --build build --config Release

            # 上傳產出的 Plugin 為 Artifacts
            # .exp/.lib 是 MSVC 連結 DLL 的副產物，不進 artifact 也不進 release
            - name: Upload Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: Plugin-${{ runner.os }}
                  path: |
                      build/CacophonicClip_artefacts/Release/VST3/
                      build/CacophonicClip_artefacts/Release/AAX/
                      build/CacophonicClip_artefacts/Release/AU/
                      !**/*.exp
                      !**/*.lib

    # 只有推 tag 才把產物掛上 Release（PR / 一般跑法在這裡直接 skip）
    release:
        name: Attach artifacts to release
        if: startsWith(github.ref, 'refs/tags/')
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  path: dist

            # Release assets 只能是檔案，vst3/aaxplugin/component 都是目錄，先壓成 zip。
            # rm -f 是保險：萬一 upload 的排除沒生效，也別把 .exp/.lib 掛上 release
            - name: Pack release assets
              run: |
                  (cd dist/Plugin-macOS && zip -ry "../CacophonicClip-${GITHUB_REF_NAME}-macOS.zip" VST3 AU AAX)
                  (cd dist/Plugin-Windows && rm -f VST3/*.exp VST3/*.lib AAX/*.exp AAX/*.lib && zip -ry "../CacophonicClip-${GITHUB_REF_NAME}-Windows.zip" VST3 AAX)

            # tag 已有 release（手動建過）就補上/覆蓋 asset；沒有就連同 release 一起建。
            # 沒有 checkout 步驟，gh 從環境變數拿 repo，不依賴 .git
            - name: Create release and upload assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
                      gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
                  else
                      gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/*.zip
                  fi
